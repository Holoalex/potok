<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Поток</title>

  <meta name="description" content="Учёт личных финансов. Данные хранятся только на устройстве.">
  <meta name="theme-color" content="#f0f0f0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Поток">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">

  <script>
    // Тему ставим до первой отрисовки, иначе на старте мигает белым.
    // Точное значение из настроек применит theme.js после чтения базы.
    document.documentElement.dataset.theme =
      matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px;text-align:center">Нужен включённый JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
